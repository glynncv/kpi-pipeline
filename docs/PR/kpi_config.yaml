# ==========================================
# KPI Configuration - ServiceNow ITSM
# Version: 2.1 - Added Problem Management Support
# Organization: PHINIA
# Last Updated: 2025-11-03
# ==========================================

metadata:
  version: "2.1"
  organization: "PHINIA"
  description: "ServiceNow ITSM KPI Configuration including Problem Management"
  last_updated: "2025-11-03"
  schema_version: "2.0"
  contact: "IT Service Management Team"
  changes:
    - "Added Problem Management data sources"
    - "Added Task (RCA) data mappings"
    - "Added RCA001 KPI configuration"
    - "Updated thresholds for RCA tracking"

# ==========================================
# COLUMN MAPPINGS - CSV to Internal Fields
# ==========================================
column_mappings:
  # INCIDENT DATA (from IM CSV export)
  incident_data:
    number: "number"
    opened_at: "opened_at"
    resolved_at: "u_resolved"
    closed_at: "closed_at"
    priority: "priority"
    state: "incident_state"
    assignment_group: "assignment_group"
    reassignment_count: "reassignment_count"
    short_description: "short_description"
    contact_type: "contact_type"
    category: "category"
    location_country: "location_country"
    location_city: "location_city"
    location_region: "location_u_region"
    location_name: "location_u_site_name"
  
  # REQUEST DATA (from Service Catalog CSV export)
  request_data:
    number: "number"
    opened_at: "opened_at"
    closed_at: "closed_at"
    due_date: "due_date"
    state: "request_item_state"
    assignment_group: "assignment_group"
    location_country: "request_item_u_opened_on_behalf_of_location_country"
    location_city: "request_item_u_opened_on_behalf_of_location_city"
    location_region: "request_item_u_opened_on_behalf_of_location_u_region"
    location_name: "request_item_u_opened_on_behalf_of_location_u_site_name"
  
  # PROBLEM DATA (from Problem table export)
  problem_data:
    number: "number"
    opened_at: "opened_at"
    closed_at: "closed_at"
    priority: "priority"
    state: "state"
    assignment_group: "assignment_group"
    short_description: "short_description"
    u_rca_required: "u_rca_required"
    u_root_cause: "u_root_cause"
    u_root_cause_category: "u_root_cause_category"
    u_resolution_code: "u_resolution_code"
    location_country: "location.country"
    location_name: "location.name"
    location_region: "location.u_region"
    location_site: "location.u_site_name"
    # Note: RCA fields in problem table may be unreliable - use task table instead
    u_rca_delivered_problem: "universal_request.ref_problem_task.u_rca_delivered"
    u_rca_delivered_date_problem: "universal_request.ref_problem_task.u_rca_delivered_date"
  
  # TASK DATA (from PM Task / RCA Task export)
  task_data:
    task_number: "task"
    parent_number: "task.parent.number"
    sla_name: "sla"
    stage: "stage"
    has_breached: "has_breached"
    due_date: "task.due_date"
    start_time: "start_time"
    planned_end_time: "planned_end_time"
    end_time: "end_time"
    duration: "duration"
    business_duration: "business_duration"
    time_left: "time_left"

# ==========================================
# DATA PROCESSING CONFIGURATION
# ==========================================
processing:
  # Priority extraction from text format
  priority_extraction:
    regex_pattern: "^(\\d+)"           # Extract first digit from "2 - High"
    fallback_value: 99                  # Value for unparseable priorities
    mapping:
      "1 - Critical": 1
      "2 - High": 2
      "3 - Moderate": 3
      "4 - Low": 4
  
  # Date parsing configuration
  date_parsing:
    auto_detect: true
    formats:
      - "%Y-%m-%d %H:%M:%S"
      - "%Y-%m-%d"
      - "%m/%d/%Y %H:%M:%S"
      - "%m/%d/%Y"
    timezone: "UTC"
    handle_nulls: "keep_null"
    encoding: "latin-1"                 # Handle special characters in exports
  
  # Boolean field processing (for RCA delivered, etc.)
  boolean_processing:
    true_values: ["true", "True", "TRUE", "1", "yes", "Yes", "YES", true]
    false_values: ["false", "False", "FALSE", "0", "no", "No", "NO", false]
    null_values: [null, "null", "Null", "NULL", "", "NA", "N/A"]
  
  # RCA stage mapping
  rca_stage_processing:
    completed_states: ["Achieved", "Breached"]
    ontime_states: ["Achieved"]
    late_states: ["Breached"]
    inprogress_states: ["In progress", "In Progress"]
    paused_states: ["Paused"]
  
  # Null handling strategy
  null_handling:
    reassignment_count: 0              # Treat null as zero reassignments
    resolved_at: "keep_null"           # Keep null for open incidents
    priority: 99                       # Unknown priority
    rca_delivered: false               # Default to not delivered
  
  # Data validation
  validation:
    required_incident_fields: ["number", "opened_at", "priority"]
    required_problem_fields: ["number", "opened_at", "priority"]
    required_task_fields: ["task", "task.parent.number", "stage"]

# ==========================================
# THRESHOLDS
# ==========================================
thresholds:
  # Priority definitions
  priority:
    major_incident_levels: [1, 2]      # P1 and P2 are major
    p1_critical: 1
    p2_high: 2
    p3_moderate: 3
    p4_low: 4
  
  # Aging thresholds
  aging:
    backlog_days: 10                   # Incident backlog: >10 days
    request_aging_days: 30             # Request aging: >30 days
    critical_aging_days: 5             # Critical attention needed
  
  # RCA thresholds
  rca:
    p1_rca_timeframe_days: 7          # P1 RCA due: 7 days from opened
    p2_rca_timeframe_days: 14         # P2 RCA due: 14 days from opened
    p3_rca_timeframe_days: 30         # P3 RCA due: 30 days (if required)
  
  # Problem Management thresholds
  problem_management:
    high_impact_resolution_days: 60    # High impact problems: resolve in 60 days
    standard_resolution_days: 90       # Standard problems: resolve in 90 days

# ==========================================
# KPI DEFINITIONS
# ==========================================
kpis:
  # SM001: Major Incidents (P1/P2)
  SM001:
    name: "Major Incidents (P1/P2)"
    category: "Incident Management"
    enabled: true
    priority: "Critical"
    targets:
      p1_max: 0                        # Zero tolerance for P1
      p2_max: 5                        # Maximum 5 P2 incidents per period
    weight: 20                         # 20% of scorecard
    required_fields: ["number", "priority"]
  
  # SM002: Incident Backlog (OKR KR4)
  SM002:
    name: "ServiceNow Backlog"
    category: "Incident Management"
    enabled: true
    priority: "Critical"
    okr_alignment: "R002-KR4"
    targets:
      backlog_max: 0                   # Absolute count (aspirational)
      backlog_percentage_max: 10.0     # Max 10% backlog
      adherence_min: 90.0              # 90% adherence to 10-day threshold
    weight: 35                         # 35% of scorecard
    required_fields: ["number", "opened_at", "resolved_at"]
  
  # SM003: Service Request Aging (OKR KR5)
  SM003:
    name: "Service Request Aging"
    category: "Service Catalog"
    enabled: true
    priority: "Key"
    okr_alignment: "R002-KR5"
    targets:
      backlog_max: 0                   # Absolute count (aspirational)
      backlog_percentage_max: 10.0     # Max 10% aged >30 days
      aging_threshold_days: 30         # Threshold for "aged" requests
    weight: 20                         # 20% of scorecard
    required_fields: ["number", "opened_at", "closed_at"]
  
  # SM004: First Call Resolution (OKR KR6)
  SM004:
    name: "First Call Resolution (FCR)"
    category: "Service Desk Performance"
    enabled: true
    priority: "Key"
    okr_alignment: "R002-KR6"
    targets:
      fcr_rate_min: 80.0               # Minimum 80% FCR
      fcr_rate_optimal: 85.0           # Optimal 85% FCR
    excluded_channels: ["Self Heal", "Event"]
    weight: 10                         # 10% of scorecard (reduced from 15% with RCA001 added)
    required_fields: ["number", "reassignment_count", "resolved_at", "contact_type"]
  
  # RCA001: RCA Completion Rate (NEW - Problem Management)
  RCA001:
    name: "RCA Completion Rate"
    category: "Problem Management"
    enabled: true
    priority: "Critical"
    okr_alignment: "R002-KR7 (Potential)"
    description: "Percentage of P1/P2 problems with RCA completed on-time"
    targets:
      completion_rate_minimum: 90.0    # Minimum acceptable: 90%
      completion_rate_expected: 95.0   # Target: 95%
      p1_rca_timeframe_days: 7        # P1 RCA due in 7 days
      p2_rca_timeframe_days: 14       # P2 RCA due in 14 days
    weight: 15                         # 15% of scorecard
    required_fields:
      problem: ["number", "priority", "opened_at", "u_rca_required"]
      task: ["task", "task.parent.number", "stage", "has_breached"]
    data_source: "joined"              # Requires Problem + Task join
  
  # PM001: Problem Resolution Rate (DISABLED - Future)
  PM001:
    name: "Problem Resolution Rate"
    category: "Problem Management"
    enabled: false
    priority: "Key"
    targets:
      resolution_rate_min: 70.0
    weight: 0
  
  # PM002: Repeat Incident Rate (DISABLED - Future)
  PM002:
    name: "Repeat Incident Rate"
    category: "Problem Management"
    enabled: false
    priority: "Key"
    targets:
      repeat_rate_max: 5.0
    weight: 0
  
  # PM003: MTTR - Problem (DISABLED - Future)
  PM003:
    name: "Mean Time to Resolve Problems"
    category: "Problem Management"
    enabled: false
    priority: "Supporting"
    weight: 0
  
  # PM004: Problem-to-Incident Ratio (DISABLED - Future)
  PM004:
    name: "Problem-to-Incident Ratio"
    category: "Problem Management"
    enabled: false
    priority: "Supporting"
    weight: 0
  
  # PM005: KEDB Usage (DISABLED - Optional)
  PM005:
    name: "Knowledge Base Usage Rate"
    category: "Knowledge Management"
    enabled: false
    priority: "Supporting"
    weight: 0
  
  # GEOGRAPHIC: Geographic Analysis
  GEOGRAPHIC:
    name: "Geographic Analysis"
    category: "Analytics"
    enabled: true
    priority: "Informational"
    weight: 0                          # Informational only, no weight

# ==========================================
# SCORECARD WEIGHTING
# ==========================================
scorecard:
  description: "Overall performance score calculation"
  
  # Current active weights (with RCA001)
  active_weights:
    SM001: 20     # Major Incidents
    SM002: 35     # Incident Backlog (OKR KR4)
    SM003: 20     # Service Request Aging (OKR KR5)
    SM004: 10     # First Call Resolution (OKR KR6)
    RCA001: 15    # RCA Completion (Problem Management)
    # Total: 100%
  
  # Fallback weights if SM003 disabled (no service catalog data)
  sm003_disabled_weights:
    SM001: 25
    SM002: 40
    SM004: 15
    RCA001: 20
    # Total: 100%
  
  # Fallback weights if RCA001 disabled (no problem data)
  rca001_disabled_weights:
    SM001: 25
    SM002: 40
    SM003: 20
    SM004: 15
    # Total: 100%
  
  # Performance bands
  performance_bands:
    excellent:
      min_score: 90
      description: "Outstanding performance"
      color: "green"
    good:
      min_score: 80
      description: "Meeting expectations"
      color: "green"
    needs_improvement:
      min_score: 60
      description: "Below target"
      color: "yellow"
    poor:
      min_score: 0
      description: "Critical - immediate action required"
      color: "red"

# ==========================================
# GLOBAL STATUS RULES
# ==========================================
global_status_rules:
  # Rules for determining overall KPI status
  status_levels:
    - name: "green"
      description: "Meeting or exceeding targets"
      icon: "✓"
    - name: "yellow"
      description: "Warning - approaching threshold"
      icon: "⚠"
    - name: "red"
      description: "Critical - below minimum acceptable"
      icon: "✗"
  
  # Escalation triggers
  escalation:
    immediate:
      - "P1 incident count > 0"
      - "Backlog percentage > 20%"
      - "RCA completion rate < 80%"
    urgent:
      - "P2 incident count > 10"
      - "Backlog percentage > 15%"
      - "RCA completion rate < 85%"
    monitor:
      - "P2 incident count > 5"
      - "Backlog percentage > 10%"
      - "FCR rate < 80%"
      - "RCA completion rate < 90%"

# ==========================================
# DATA FILE PATHS
# ==========================================
data_files:
  incident_file: "PYTHON_EMEA_IM_last_90_days_redacted_clean.csv"
  request_file: "PYTHON_EMEA_SCT_last_90_days_redacted_clean.csv"
  problem_file: "PYTHON_EMEA_PM_P1P2__This_Year_.csv"
  task_file: "PYTHON_EMEA_TASK_RCA__This_Year_.csv"
  
  # Optional - not required for Phase 1
  problem_incident_link_file: null
  knowledge_base_file: null

# ==========================================
# OUTPUT CONFIGURATION
# ==========================================
output:
  excel:
    filename: "KPI_Dashboard_{date}.xlsx"
    sheets:
      - name: "Executive Summary"
        enabled: true
      - name: "KPI Details"
        enabled: true
      - name: "SM001 - Major Incidents"
        enabled: true
      - name: "SM002 - Backlog"
        enabled: true
      - name: "SM003 - Requests"
        enabled: true
      - name: "SM004 - FCR"
        enabled: true
      - name: "RCA001 - RCA Completion"
        enabled: true
      - name: "Problem Management"
        enabled: true
      - name: "Geographic Analysis"
        enabled: true
      - name: "OKR Tracking"
        enabled: true
  
  formatting:
    decimal_places: 1
    date_format: "YYYY-MM-DD"
    percentage_format: "0.0%"
    include_timestamps: true
    include_metadata: true

# ==========================================
# ENVIRONMENT-SPECIFIC OVERRIDES
# ==========================================
environments:
  development:
    thresholds:
      aging:
        backlog_days: 5               # Shorter threshold for testing
    validation:
      strict_mode: false
  
  production:
    validation:
      strict_mode: true
    output:
      include_metadata: true
  
  testing:
    kpis:
      SM001:
        targets:
          p2_max: 10                  # Higher threshold for testing
